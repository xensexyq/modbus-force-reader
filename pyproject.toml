[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modbus-force-reader"
version = "0.1.0"
description = "Read a force sensor over Modbus RTU through a USB-to-RS485 adapter"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "xensexyq"}]
dependencies = ["pyserial>=3.5,<4"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
]

[project.scripts]
modbus-force-reader = "modbus_force_reader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
